<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャオチャオ</title>
<style>
body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:12px;background:#f4efe6;color:#333}
h1{font-size:22px;margin:4px 0}
input,button{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}
button{background:#7a4b2a;color:#fff;border:0;border-radius:8px}
button.sub{background:#999}
button.warn{background:#b33}
.row{display:flex;gap:8px}.row button{flex:1}
.bridge{display:flex;flex-direction:column;background:#c9a56b;border:3px solid #6b4423;border-radius:10px;padding:4px}
.cell{display:flex;align-items:center;gap:6px;min-height:34px;border-bottom:2px dashed #8a6a3a;padding:2px 6px}
.cell:last-child{border:0}
.cell.s{background:#e8d9b5}.cell.g{background:#bfe0b0}
.n{width:56px;font-size:13px;color:#4a3419}
.pc{display:inline-block;width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #333}
.pl{display:flex;align-items:center;gap:8px;padding:6px;margin:4px 0;background:#fff;border-radius:8px;font-size:15px}
.pl.turn{outline:3px solid #7a4b2a}
.dot{width:20px;height:20px;border-radius:50%;flex:none}
.box{background:#fff;border-radius:10px;padding:10px;margin:10px 0}
.big{font-size:44px;text-align:center}
#dice.shake{animation:sh .7s}
@keyframes sh{0%,100%{transform:rotate(0)}20%{transform:rotate(-25deg) scale(1.2)}40%{transform:rotate(25deg)}60%{transform:rotate(-20deg) scale(1.2)}80%{transform:rotate(15deg)}}
.hist{font-size:14px;line-height:1.6;max-height:180px;overflow:auto}
#msg{color:#b00;min-height:20px}
</style>
</head>
<body>
<h1>チャオチャオ</h1>
<div id="home">
  <input id="name" placeholder="あなたの名前" maxlength="12">
  <button onclick="act.create()">部屋を作る</button>
  <input id="code" placeholder="部屋番号（6桁）" inputmode="numeric" maxlength="6">
  <button onclick="act.join()">部屋に入る</button>
</div>
<div id="game" hidden></div>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
