<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>チャオチャオ</title>
<style>
  body{font-family:sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#f4efe6;color:#333}
  input,button{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}
  button{background:#7a4b2a;color:#fff;border:0;border-radius:8px}
  .p{padding:8px;margin:4px 0;border-radius:8px;color:#fff}
  .red{background:#d33}.blue{background:#36c}.yellow{background:#c90}.green{background:#2a7}
</style>
</head>
<body>
<h1>チャオチャオ</h1>
<div id="home">
  <input id="name" placeholder="あなたの名前" maxlength="12">
  <button id="create">部屋を作る</button>
  <input id="code" placeholder="部屋番号（6桁）" inputmode="numeric" maxlength="6">
  <button id="join">部屋に入る</button>
</div>
<div id="lobby" hidden>
  <h2>部屋番号：<span id="roomcode"></span></h2>
  <div id="list"></div>
</div>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://ysmkrhqemvesxdljtmuq.supabase.co',
  'sb_publishable_sb3iCEI8L7pyOzuBMe1vbA_HIxnLpGE');
const $ = id => document.getElementById(id);
const say = t => $('msg').textContent = t || '';

async function init(){
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    const r = await sb.auth.signInAnonymously();
    if (r.error) return say('ログインに失敗：' + r.error.message);
  }
  const saved = localStorage.getItem('roomcode');
  if (saved) $('code').value = saved;
}

async function enter(code){
  localStorage.setItem('roomcode', code);
  $('home').hidden = true; $('lobby').hidden = false;
  $('roomcode').textContent = code;
  await refresh(code);
  sb.channel('r' + code)
    .on('postgres_changes', {event:'*', schema:'public', table:'players'}, () => refresh(code))
    .subscribe();
}

async function refresh(code){
  const { data: room } = await sb.from('rooms').select('id,status').eq('code', code).single();
  if (!room) return;
  const { data } = await sb.from('players').select('seat,name,color')
    .eq('room_id', room.id).order('seat');
  $('list').innerHTML = (data || []).map(p =>
    `<div class="p ${p.color}">${p.name}</div>`).join('');
}

$('create').onclick = async () => {
  say('');
  const { data, error } = await sb.rpc('create_room', { p_name: $('name').value });
  if (error) return say(error.message);
  enter(data);
};
$('join').onclick = async () => {
  say('');
  const { data, error } = await sb.rpc('join_room',
    { p_code: $('code').value, p_name: $('name').value });
  if (error) return say(error.message);
  enter(data);
};
init();
</script>
</body>
</html>
